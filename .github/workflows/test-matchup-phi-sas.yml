name: PHI SAS tactical matchup
on:
  push:
    paths:
      - 'test_matchup_phi_sas.py'
      - '.github/workflows/test-matchup-phi-sas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python test_matchup_phi_sas.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matchup_phi_sas_report.json
          git diff --cached --quiet || git commit -m "Record PHI SAS tactical matchup"
          git push
