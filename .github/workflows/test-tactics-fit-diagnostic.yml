name: Tactics fit diagnostic
on:
  push:
    paths:
      - 'test_tactics_fit_diagnostic.py'
      - '.github/workflows/test-tactics-fit-diagnostic.yml'
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit roster fit without engine changes
        run: python test_tactics_fit_diagnostic.py
