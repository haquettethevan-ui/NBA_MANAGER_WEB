name: Update NBA contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"
  push:
    paths:
      - "update_contracts.py"
      - ".github/workflows/update-contracts.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import current contracts
        run: python update_contracts.py
      - name: Commit contract data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players_2k27.json data/contracts_2026_27_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Update NBA 2026-27 contracts"
          git push
