name: Import 2026-27 salaries
# trigger: execute full salary import
on:
  push:
    paths:
      - 'import_salaries_2026_27.py'
      - '.github/workflows/import-salaries.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import Basketball-Reference salaries
        run: python import_salaries_2026_27.py
      - name: Commit salary data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players_2k27.json data/salary_import_report.json
          git diff --cached --quiet || git commit -m "Import 2026-27 NBA salaries"
          git push
