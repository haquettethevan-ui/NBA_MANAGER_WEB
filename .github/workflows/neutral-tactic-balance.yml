name: Neutral tactic balance
on:
  push:
    branches: [main]
    paths:
      - "test_tactics_neutral_balance.py"
      - "engine_v55.py"
      - "server.py"
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile server.py engine_v55.py test_tactics_neutral_balance.py
      - run: python test_tactics_neutral_balance.py
