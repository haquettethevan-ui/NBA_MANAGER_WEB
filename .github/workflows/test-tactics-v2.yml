name: Tactics V2 stress test
on:
  push:
    paths:
      - 'test_tactics_v2.py'
      - 'engine_v55.py'
      - '.github/workflows/test-tactics-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python test_tactics_v2.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tactics_v2_test_report.json
          git diff --cached --quiet || git commit -m "Record V2 tactical stress test"
          git push
