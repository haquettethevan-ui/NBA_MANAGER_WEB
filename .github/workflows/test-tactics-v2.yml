name: Tactics V2 league-wide test
on:
  push:
    paths:
      - 'test_tactics_v2.py'
      - '.github/workflows/test-tactics-v2.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all-team tactical test
        run: python test_tactics_v2.py

# paired-seeds rerun
