name: Tactical wiring regression
on:
  push:
    paths:
      - 'engine_v55.py'
      - 'test_tactical_wiring.py'
      - '.github/workflows/tactical-wiring.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tactical wiring
        run: python test_tactical_wiring.py

# rerun wiring regression after tactical changes
