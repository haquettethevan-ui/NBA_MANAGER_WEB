name: Benchmark scoring
on:
  push:
    paths:
      - '.github/workflows/benchmark-scoring.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run 1000-game 2PT and assist benchmark
        run: python test_engine.py 1000
