name: AI tactics benchmark

on:
  push:
    branches: [main]
    paths:
      - "engine_v55.py"
      - "legacy_main.py"
      - "main.py"
      - "server.py"
      - "test_tactics_neutral_balance.py"
      - ".github/workflows/ai-benchmark.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile engine_v55.py legacy_main.py main.py server.py test_tactics_neutral_balance.py

      - name: Tactics balance and roster-fit benchmark
        run: python -u test_tactics_neutral_balance.py
