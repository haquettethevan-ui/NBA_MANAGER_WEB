name: AI tactics benchmark
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile server.py test_ai_tactics_optimality.py
      - name: Tactical benchmark
        run: python test_ai_tactics_optimality.py
