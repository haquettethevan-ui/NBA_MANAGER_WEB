name: Test possession engine V2
on:
  push:
    branches: [experimental/possession-engine-v2]
    paths:
      - 'experimental/**'
      - '.github/workflows/test-possession-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run independent V2 tests
        run: python -m unittest discover -s experimental -p 'test_engine_v2.py' -v
