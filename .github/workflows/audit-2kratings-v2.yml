name: Audit 2KRatings V2
on:
  push:
    branches: [experimental/possession-engine-v2]
    paths:
      - '.github/workflows/audit-2kratings-v2.yml'
      - 'scripts/audit_2kratings_v2.py'
      - 'scripts/apply_tyler_nickel_placeholder.py'
      - 'scripts/restore_verified_v2_attributes.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve last verified candidate before scraping
        run: |
          if test -f data/players_2k27_v2_candidate.json; then
            cp data/players_2k27_v2_candidate.json data/players_2k27_v2_baseline.json
          fi
      - name: Scrape all NBA rosters to isolated output
        env:
          NBA_MANAGER_SCRAPE_OUTPUT: data/players_2k27_v2_candidate.json
        run: python scrape_2kratings.py --refresh --workers 2 --delay 1.0
      - name: Restore incomplete ratings from prior verified snapshot
        run: python scripts/restore_verified_v2_attributes.py
      - name: Apply approved Tyler Nickel placeholder
        run: python scripts/apply_tyler_nickel_placeholder.py
      - name: Audit completeness, duplicates and inconsistencies
        run: python scripts/audit_2kratings_v2.py
      - name: Run V2 unit and rotation tests
        run: python -m unittest discover -s experimental -p 'test_engine_v2.py' -v
      - name: Verify real roster integration and smoke match
        run: |
          PYTHONPATH=experimental python - <<'PY'
          from engine_v2_rosters import load_rosters
          from engine_v2 import simulate_game
          rosters = load_rosters()
          assert len(rosters) == 30, f"Expected 30 teams, got {len(rosters)}"
          assert sum(map(len, rosters.values())) >= 500
          for team, players in rosters.items():
              assert len(players) >= 5, team
          score = simulate_game(rosters["ATL"][:5], rosters["BOS"][:5], seed=17, possessions_per_team=12)["score"]
          assert all(isinstance(n, int) and n >= 0 for n in score)
          print("V2 real-player import verified:", sum(map(len, rosters.values())), "players, sample score", score)
          PY
      - name: Persist isolated V2 candidate on experimental branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/players_2k27_v2_candidate.json data/scrape_report.json data/audit_2kratings_v2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update isolated 2KRatings V2 candidate and audit'
            git push origin HEAD:experimental/possession-engine-v2
          fi
      - name: Upload candidate data and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-2kratings-v2-audit
          path: |
            data/players_2k27_v2_candidate.json
            data/scrape_report.json
            data/audit_2kratings_v2.json
          if-no-files-found: warn
          retention-days: 14
