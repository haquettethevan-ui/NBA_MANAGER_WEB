name: Audit 2KRatings V2
on:
  push:
    branches: [experimental/possession-engine-v2]
    paths:
      - '.github/workflows/audit-2kratings-v2.yml'
      - 'scripts/audit_2kratings_v2.py'
      - 'scripts/apply_tyler_nickel_placeholder.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scrape-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrape all NBA rosters to isolated output
        env:
          NBA_MANAGER_SCRAPE_OUTPUT: data/players_2k27_v2_candidate.json
        run: python scrape_2kratings.py --refresh --workers 2 --delay 1.0
      - name: Apply approved Tyler Nickel placeholder
        run: python scripts/apply_tyler_nickel_placeholder.py
      - name: Audit completeness, duplicates and inconsistencies
        run: python scripts/audit_2kratings_v2.py
      - name: Upload candidate data and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-2kratings-v2-audit
          path: |
            data/players_2k27_v2_candidate.json
            data/scrape_report.json
            data/audit_2kratings_v2.json
          if-no-files-found: warn
          retention-days: 14
